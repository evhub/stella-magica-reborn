l_english:
 # ===== To the Stars content (inspired by Hieronym's "To the Stars") =====

 # --- Civics ---
 civic_tts_governance:0 "Governance"
 civic_tts_governance_desc:0 "An AI-mediated, human-interpretable democracy. Every interest in society is given a Representative, some human and some artificial, and Representatives merge upward until a single Directorate decides. Every deliberation is recorded, and any citizen may review it."
 civic_tooltip_tts_governance_effects:0 "§YAI-advised deliberation§! makes the bureaucracy unusually efficient and the population unusually confident in it."
 civic_tts_msy:0 "Mahou Shoujo Youkai"
 civic_tts_msy_desc:0 "The MSY began as a handful of magical girls agreeing to share their grief cubes. It grew into a society of its own, with treasuries, schools and representatives, all built on one promise: no girl faces the dark alone."
 civic_tooltip_tts_msy_effects:0 "Requires §YMagical Legacy§!. Unlocks the §YMSY Regional Office§!."

 # --- Technologies ---
 tech_tts_cortical_implants:0 "Cortical Implants"
 tech_tts_cortical_implants_desc:0 "A thread-thin neural interface that lets the mind query the network as easily as it recalls a memory. Within a generation, nobody remembers how people learned anything without one."
 tech_tts_taccomp:0 "Tactical Computers"
 tech_tts_taccomp_desc:0 "The TacComp: an implanted assistant intelligence that tracks threats, plots firing solutions and quietly suggests that perhaps its host should duck. Soldiers and magical girls alike learn to trust the voice in their head."
 tech_tts_msy_logistics:0 "MSY Logistics"
 tech_tts_msy_logistics_desc:0 "Grief cubes go where they are needed, not where they happen to be found. The MSY's distribution network turns a scramble for survival into an orderly, accountable system."
 tech_tts_magops_doctrine:0 "MagOps Doctrine"
 tech_tts_magops_doctrine_desc:0 "Magical Operations: magical girl squads formally integrated into the military chain of command, with TacComp coordination, cube resupply and a doctrine built around powers no ordinary soldier possesses."

 # --- Buildings and jobs ---
 building_tts_msy_office:0 "MSY Regional Office"
 building_tts_msy_office_desc:0 "Part treasury, part clinic, part clubhouse. The local magical girls come here to collect their cube allotments, file their witch-hunt reports and, sometimes, simply not be alone."
 job_tts_msy_liaison:0 "MSY Liaison"
 job_tts_msy_liaison_plural:0 "MSY Liaisons"
 mod_job_tts_msy_liaison_add:0 "$job_tts_msy_liaison$ Jobs"
 job_tts_msy_liaison_desc:0 "Liaisons keep the cube ledgers honest and translate between the magical girls and the planetary authorities, who are still not entirely sure what to make of each other."

 # --- Armies ---
 tts_magops_army:0 "MagOps Squad"
 tts_magops_army_plural:0 "MagOps Squads"
 tts_magops_army_desc:0 "A handful of magical girls with TacComps, cube reserves and a teleporter on call. Enemy commanders tend to discover them shortly before they discover nothing at all."

 # --- Leader traits ---
 leader_trait_tts_taccomp:0 "TacComp"
 leader_trait_tts_taccomp_desc:0 "This leader's implanted tactical computer calculates firing solutions faster than any human could."
 leader_trait_tts_teleporter:0 "Teleporter"
 leader_trait_tts_teleporter_desc:0 "A magical girl who can step across space at will, and who has learned to bring a fleet's worth of momentum with her."
 leader_trait_tts_clairvoyant:0 "Clairvoyant"
 leader_trait_tts_clairvoyant_desc:0 "Her soul gem glows faintly whenever something interesting lies just past the sensor horizon."
 leader_trait_tts_healer:0 "Healer"
 leader_trait_tts_healer_desc:0 "She wished for others to be well, and somehow the whole colony has felt better ever since she arrived."
 leader_trait_tts_msy_veteran:0 "MSY Veteran"
 leader_trait_tts_msy_veteran_desc:0 "Decades of balancing cube ledgers and keeping girls alive have made this leader indispensable to the mutual aid society."

 # --- Events: institutions ---
 stella_tts_inst.1.name:0 "The MSY Charter"
 stella_tts_inst.1.desc:0 "The founders of the Mahou Shoujo Youkai sign their charter in a borrowed meeting room, with a box of grief cubes on the table between them. The rules are simple. Cubes are shared. Reports are honest. Nobody is abandoned to despair.\n\nIt is a small beginning, but every one of them remembers what it was like to fight alone."
 stella_tts_inst.1.a:0 "No girl faces the dark alone."
 stella_tts_inst.2.name:0 "Governance Convenes"
 stella_tts_inst.2.desc:0 "The first full session of Governance opens without ceremony. Human representatives take their seats; advisory intelligences take theirs, in a manner of speaking. The agenda, the deliberations and the dissenting opinions are all published as they happen.\n\nA commentator remarks that it is the most boring revolution in history. Governance takes it as a compliment."
 stella_tts_inst.2.a:0 "Let the deliberations begin."
 stella_tts_inst.3.name:0 "TacComp Deployment"
 stella_tts_inst.3.desc:0 "The first tactical computers roll out to our commanders. Early reports describe the experience as \"having a very polite, very fast second officer living behind your left eye.\" One admiral complains that hers keeps pointing out her mistakes. Her gunnery scores, it must be said, have never been better."
 stella_tts_inst.3.a:0 "Install it in our best commander first."
 stella_tts_inst.4.name:0 "The First MagOps Squad"
 stella_tts_inst.4.desc:0 "With MagOps doctrine approved, the military calls for volunteers. The first to step forward is a teleporter who arrives at the recruitment office by appearing inside it, slightly out of breath, and apologizes for not using the door.\n\nShe will lead the first squad."
 stella_tts_inst.4.a:0 "Welcome to MagOps."
 # --- The Cephalopod War ---
 NAME_tts_Ceph_Mothership_Fleet:0 "Mothership"
 NAME_tts_Ceph_Raid_Fleet:0 "Raiding Swarm"
 NAME_tts_Ceph_Skirmisher:0 "Skirmisher"
 NAME_tts_Ceph_Harrier:0 "Harrier"
 NAME_tts_Ceph_Leviathan:0 "Leviathan"
 NAME_tts_Ceph_Mothership:0 "Mothership"
 stella_tts_ceph.3.name:0 "Silence on Every Channel"
 stella_tts_ceph.3.desc:0 "A frontier picket reports unidentified ships moving through an unclaimed system beyond our borders. The hulls are organic in outline, almost tentacled, and they are not alone. Long-range sensors resolve a vessel the size of a small moon holding position behind them.\n\nWe have hailed them on every frequency we know, in every language our linguists could assemble. There has been no answer. Then the picket stopped reporting.\n\nWhatever they are, they did not come to talk."
 stella_tts_ceph.3.a:0 "Sound the alarm. Every fleet to readiness."
 stella_tts_ceph.3.b:0 "Release the MSY's emergency cube reserves to the front."
 stella_tts_ceph.20.name:0 "The Mothership Falls"
 stella_tts_ceph.20.desc:0 "The great Cephalopod vessel breaks apart under concentrated fire, venting something that is not quite atmosphere into the void. The raiding swarms falter almost at once, as if a single will had been severed.\n\nThe wreck is still out there: a mountain of alien biology and machinery that nobody has ever examined up close. Our engineers are already arguing about who gets to go first."
 stella_tts_ceph.20.a:0 "Secure the wreck and begin the analysis."
 stella_tts_ceph.30.name:0 "Lessons from the Wreck"
 stella_tts_ceph.30.desc:0 "Months of careful dissection have given us our first real understanding of the Cephalopods' ships: layered armor that regrows, weapons tuned to frequencies our shields handle poorly, and a command structure that seems to be grown rather than built.\n\nWe still do not know what they want. But now we know how to hurt them."
 stella_tts_ceph.30.a:0 "Put it to use."
 tech_tts_cephalopod_analysis:0 "Cephalopod Analysis"
 tech_tts_cephalopod_analysis_desc:0 "Everything we learned from the wreck of the Cephalopod mothership: regenerating armor layers and the weak points of the alien war machine."
 TTS_CEPHALOPOD_WRECKAGE:0 "The Mothership Wreck"
 TTS_CEPHALOPOD_WRECKAGE_DESC:0 "Dissect the wreck of the Cephalopod mothership and learn what we can about our silent enemy."
 # --- Contracts and wishes ---
 stella_tts_wish.2.name:0 "A New Contract"
 stella_tts_wish.2.desc:0 "The MSY registry logs a new soul gem tonight. A girl from one of our worlds met a small white creature on her way home, listened to its offer, and said yes.\n\nShe has already made her wish. All that remains is to learn what she wished for, and what her new power will mean for the rest of us."
 stella_tts_wish.2.a:0 "She wished for her home to prosper."
 stella_tts_wish.2.b:0 "She wished to heal someone she loved."
 stella_tts_wish.2.c:0 "She wished for everyone to be safe."
 stella_tts_wish.2.d:0 "She wished to see beyond the stars."
 stella_tts_wish_prosperity:0 "A Wish for Prosperity"
 stella_tts_wish_prosperity_desc:0 "A girl wished for this world to flourish. Somehow, it has."
 stella_tts_wish_guardian:0 "A Guardian's Wish"
 stella_tts_wish_guardian_desc:0 "A girl wished for everyone here to be protected, and she takes that wish very seriously."
 stella_tts_wish.21.name:0 "Demons in the Streets"
 stella_tts_wish.21.desc:0 "With our grief cube reserves exhausted, the hunts have faltered. Girls who cannot purify their soul gems have stopped hunting, and some have already been taken peacefully by the Law of Cycles. Their absence leaves too few hunters to keep up.\n\nDemons are gathering on one of our worlds faster than anyone can clear them, and their miasma is settling over the cities."
 stella_tts_wish.21.a:0 "Fund an emergency hunt."
 stella_tts_wish.21.b:0 "We cannot spare anything. The girls will have to manage."
 stella_tts_witch_sighting:0 "Demon Outbreak"
 stella_tts_witch_sighting_desc:0 "Too few magical girls are hunting here, and demons are multiplying. Their miasma weighs on everyone."
 # --- The Church of Hope ---
 stella_tts_hope.10.name:0 "The Church of Hope"
 stella_tts_hope.10.desc:0 "Magical girls have always told one another stories about the Goddess: the one who saved them from despair, and who comes for each of them gently at the end. Now those stories have congregations, hymns and a name. The Cult of Hope asks the state for legal recognition and for the right to build its churches openly.\n\nSome of our advisors call it a comfort the girls badly need. Others would rather the state stayed out of matters of faith."
 stella_tts_hope.10.a:0 "Recognise the Church of Hope."
 stella_tts_hope.10.a.tooltip:0 "Unlocks the §YTheology of Hope§! technology, the §YChurch of Hope§! and visions of the Goddess. A §Ydemon outbreak§! becomes half as likely when §Ygrief cubes§! run short."
 stella_tts_hope.10.b:0 "Faith is a private matter. The state stays secular."
 stella_tts_church_recognised:0 "Church of Hope"
 stella_tts_church_recognised_desc:0 "The state recognises the Church of Hope. Its churches are open to everyone, and its faith steadies the girls on the front line."
 tech_tts_theology_of_hope:0 "Theology of Hope"
 tech_tts_theology_of_hope_desc:0 "The Church of Hope's scattered testimonies, hymns and visions, gathered into something a congregation can hold on to."
 building_tts_church_of_hope:0 "Church of Hope"
 building_tts_church_of_hope_desc:0 "Candles, quiet music, a wall of names, and a door that is never locked. Magical girls come here to remember the friends the Goddess took home, and everyone else comes because it helps."
 job_tts_hope_priest:0 "Priest of Hope"
 job_tts_hope_priest_plural:0 "Priests of Hope"
 job_tts_hope_priest_desc:0 "Priests of Hope keep the church open, read the names aloud, and sit with anyone who needs company in the dark."
 mod_job_tts_hope_priest_add:0 "$job_tts_hope_priest$ Jobs"
 leader_trait_tts_priestess_of_hope:0 "Priestess of Hope"
 leader_trait_tts_priestess_of_hope_desc:0 "An ordained voice of the Church of Hope, as comfortable counselling a grieving family as a governing council."
 stella_tts_miracle:0 "Site of a Miracle"
 stella_tts_miracle_desc:0 "Pilgrims say the Goddess herself was seen here. Whatever the truth, the people believe it."
 stella_tts_hope.2.name:0 "A Vision of the Goddess"
 stella_tts_hope.2.desc:0 "A magical girl on the brink of despair reports that she was not alone. A figure in white, kind and impossibly familiar, took her hand and told her it was not yet her time. Her soul gem, nearly black an hour before, is clear again.\n\nThe Church of Hope is overflowing with pilgrims. The skeptics want an investigation."
 stella_tts_hope.2.a:0 "Proclaim it a miracle."
 stella_tts_hope.2.b:0 "Study it carefully. Faith can wait for the data."
 stella_tts_hope.3.name:0 "The Church of Hope"
 stella_tts_hope.3.desc:0 "With its theology finally written down, the scattered congregations of the Cult of Hope organise into a proper Church. Its first ordained priestess takes a seat on the council, promising to speak for the living and remember the departed."
 stella_tts_hope.3.a:0 "May the Goddess watch over us."
 # --- Familiar faces ---
 NAME_tts_ryouko:0 "Shizuki Ryouko"
 stella_tts_faces.2.name:0 "The Girl Who Wanted the Stars"
 stella_tts_faces.2.desc:0 "She grew up in Mitakihara, in a peaceful city in a peaceful age, and she spent her whole childhood staring up at the sky as if it owed her something. When the offer came, she knew exactly what to wish for: to leave Earth and go where no one has gone before.\n\nHer power is teleportation. She walked into the MagOps recruitment office, appeared on the other side of the desk mid-sentence, and asked how soon she could ship out. Clarisse, her new TacComp, has already filed a mild complaint about her enthusiasm."
 stella_tts_faces.2.a:0 "Give her a ship. She seems the type to need one."
 stella_tts_faces.4.name:0 "Behind the Lines"
 stella_tts_faces.4.desc:0 "Ryouko has a proposal, delivered with a little too much excitement. She can teleport a MagOps squad directly into the Cephalopod mothership, plant charges in whatever passes for its reactor, and teleport out before anything notices.\n\nClarisse estimates the odds of everyone coming back at better than even. Ryouko insists that this is excellent."
 stella_tts_faces.4.a:0 "Authorize the strike."
 stella_tts_faces.4.b:0 "Too dangerous. We are not losing her for this."
 stella_tts_ceph_sabotaged:0 "Sabotaged from Within"
 stella_tts_ceph_sabotaged_desc:0 "A MagOps teleporter strike has crippled this vessel's defenses from the inside."
 stella_tts_faces.6.name:0 "The Mentor"
 stella_tts_faces.6.desc:0 "With so many new girls contracting, the MSY needs people who remember how hard the first year is. One of our officials, an old hand at the cube ledgers and the long night shifts, has started taking the new girls under her wing. They come to her with their fears, and leave with a plan."
 stella_tts_faces.6.a:0 "The MSY looks after its own."
 # --- Policy and society ---
 policy_tts_magical_disclosure:0 "Magical Girl Disclosure"
 policy_tts_magical_disclosure_desc:0 "Should the public know that magical girls exist, and what they do every night to keep everyone safe?"
 tts_disclosure_veiled:0 "The Veil"
 tts_disclosure_veiled_name:0 "The Veil"
 tts_disclosure_veiled_desc:0 "Magical girls work in secret, as they always have. The public sleeps soundly, and the girls fight alone."
 tts_disclosure_public:0 "Public Disclosure"
 tts_disclosure_public_name:0 "Public Disclosure"
 tts_disclosure_public_desc:0 "Magical girls are acknowledged, supported and celebrated. Public support brings funding and grief cube donations, along with a certain amount of anxiety."
 edict_tts_grief_cube_rationing:0 "Grief Cube Rationing"
 edict_tts_grief_cube_rationing_desc:0 "Strict allotments for the armed forces stretch the cube stockpile further. Nobody enjoys being rationed, least of all the girls fighting on the front line."
 mod_armies_grief_cube_upkeep_mult:0 "Army $grief_cube$ Upkeep"
 edict_tts_msy_recruitment_drive:0 "MSY Recruitment Drive"
 edict_tts_msy_recruitment_drive_desc:0 "The mutual aid society opens its doors, its ledgers and its cube stores to every girl who wants to join."
 # --- Ship components ---
 TTS_TACCOMP_FIRE_CONTROL:0 "TacComp Fire Control"
 TTS_TACCOMP_FIRE_CONTROL_DESC:0 "Networks the ship's guns into the crew's tactical computers, which share firing solutions faster than any human gunner could."
 TTS_SOUL_GEM_RESONATOR:0 "Soul Gem Resonator"
 TTS_SOUL_GEM_RESONATOR_DESC:0 "A cube-fed crystal lattice that echoes a magical girl's barrier magic across the hull. Nobody fully understands why it works. The MSY prefers not to discuss where the cubes go."
 # --- Origin ---
 origin_tts_unified_earth:0 "The Unified Earth"
 origin_tts_unified_earth_desc:0 "Our homeworld's last great war ended not in conquest but in a promise: one government for everyone, advised by the intelligences we built and answerable to all of us. The scars of that war are remembered, and so is what it took to end it."
 origin_tooltip_tts_unified_earth_effects:0 "Start with §YCortical Implants§! researched. Includes §YGovernance§!: the same effects as the Governance civic, without using a civic slot."

 # --- Prescripted empire ---
 tts_united_earth:0 "United Earth"
 tts_united_earth_adj:0 "Terran"

 # --- The Thinkers (Cephalopod empire) ---
 tts_thinker_preserving:0 "/Thinker-preserving Tentacle"
 tts_thinker_preserving_adj:0 "Cephalopod"
 tts_species_thinker:0 "Thinker"
 tts_species_thinker_plural:0 "Thinkers"
 tts_species_thinker_adj:0 "Thinker"
 NAME_tts_thinker_homeworld:0 "Great Sea"
 NAME_tts_thinker_system:0 "Deep Origin"
 NAME_tts_thinker_ruler:0 "Order-Preserving"
 TTS_THINKER_FLEET_ORD:0 "$ORD$ Enforcement Group"
 TTS_THINKER_ARMY_ORD:0 "$ORD$ Warform Shoal"
 TTS_THINKER_DEFENSE_ARMY_ORD:0 "$ORD$ Reef Guard"
 trait_tts_thinker_backups:0 "Mind Backups"
 trait_tts_thinker_backups_desc:0 "Every Thinker mind is backed up. Losing a body is called bodyloss, and it is an inconvenience rather than a death."
 trait_tts_empathize_opening:0 "Empathize-Opening"
 trait_tts_empathize_opening_desc:0 "Thinkers can open their minds to one another and share their whole preference-specification. Their civilization is built on it."
 trait_tts_emotionless:0 "Emotionless"
 trait_tts_emotionless_desc:0 "Thinkers say they do not have emotions as humans understand them. Their discipline is total."
 origin_tts_thinker_vanguard:0 "Consensus Vanguard"
 origin_tts_thinker_vanguard_desc:0 "This empire is only the forward edge of the Thinker Consensus, a civilization of over a trillion minds. Its ships carry technology far beyond anything its neighbours have built."
 origin_tooltip_tts_thinker_vanguard_effects:0 "Ship shields +15%\nShip armor regenerates +3 per day\nShip weapon range +10%\nStarts with improved lasers, shields, strike craft and destroyers"

 # --- The Consensus ---
 leader_trait_tts_consensus_envoy:0 "Consensus Envoy"
 leader_trait_tts_consensus_envoy_desc:0 "Has opened her mind to the Thinkers, and they to her. She came back knowing how they think."
 stella_tts_consensus_contact:0 "Contact with the Consensus"
 stella_tts_consensus_contact_desc:0 "Thinker scientists share what they know, mind to mind. Some of it even makes sense."
 stella_tts_consensus_censure:0 "Censured by the Consensus"
 stella_tts_consensus_censure_desc:0 "The Consensus has withdrawn its mandate and its resources. /Thinker-preserving fights on alone."
 stella_tts_cons.support.tooltip:0 "Another Tentacle will speak against /Thinker-preserving before the Consensus."
 stella_tts_cons.2.name:0 "Peace-cultivating"
 stella_tts_cons.2.desc:0 "A single Cephalopod ship slips past our pickets and stops, unarmed, in the middle of a patrol route. It does not hail us. Instead Ryouko wakes in the night with an alien voice in her head, careful and polite, offering a name: Peace-cultivating.\n\nIt says it is a ship, and also a person, and a member of something called /Ahimsa-extending. It says a magical girl named Akemi Homura found its people and gave them a document claiming the war against us was started on false premises. It wants Ryouko to come with it and help prove that.\n\nClarisse, Ryouko's TacComp, would like it on record that this is obviously a trap."
 stella_tts_cons.2.a:0 "Let her go. If there is any chance of ending this war, we have to take it."
 stella_tts_cons.2.a.tooltip:0 "§YShizuki Ryouko§! leaves on a diplomatic mission to the Thinker home galaxy for several years."
 stella_tts_cons.2.b:0 "Absolutely not. We are not handing our best teleporter to the enemy."
 stella_tts_cons.3.name:0 "Another Galaxy"
 stella_tts_cons.3.desc:0 "The Thinkers do not live in our galaxy at all. Peace-cultivating carries Ryouko through a chain of jumps, out past the galactic core and across the gulf to another spiral, and explains on the way.\n\nThere is one Consensus and many Tentacles, each with its own values, all bound by the empathize-opening that lets every Thinker read another's preferences. When their attempts to contact us reportedly failed, the Consensus gave /Thinker-preserving the job of stopping our reality-distortion technology. They mean magic. Ryouko is, apparently, a walking example of it.\n\nIf /Thinker-preserving lied about that first contact, the other Tentacles need to hear it from her."
 stella_tts_cons.3.a:0 "Then we prove it, one Tentacle at a time."
 stella_tts_cons.4.name:0 "/Somatic-diversity"
 stella_tts_cons.4.desc:0 "/Somatic-diversity lives on mountain worlds, in bodies shaped like half-mechanical birds of prey, and it treats the body as a choice. It is an outer ally of /Thinker-preserving, but a curious one.\n\nWhat it wants is to understand human consciousness: where a magical girl's mind really lives, what a soul gem is, and whether a human could ever be backed up the way a Thinker is. Sharing what we know would make it an ally. It would also mean handing aliens our most closely guarded secret."
 stella_tts_cons.4.a:0 "Share our soul gem research. Trust has to start somewhere."
 stella_tts_cons.4.b:0 "Some secrets stay with us."
 stella_tts_cons.5.name:0 "/Eukleia-chasing"
 stella_tts_cons.5.desc:0 "/Eukleia-chasing prizes martial prowess, and its members hold ceremonial wars against one another for prestige. Nobody really dies, after all. It is also an ally of /Thinker-preserving, and it will not take seriously anyone who has not proven herself.\n\nThey offer Ryouko a ceremonial duel. Alternatively, with an ally to vouch for her, she could enter a formal Martial Debate and argue her case instead."
 stella_tts_cons.5.a:0 "Accept the duel."
 stella_tts_cons.5.a.tooltip:0 "Ryouko has a good chance of winning. Victory earns their support."
 stella_tts_cons.5.b:0 "Ask /Somatic-diversity to vouch for her, and argue it out."
 stella_tts_cons.6.name:0 "A Ceremonial Victory"
 stella_tts_cons.6.desc:0 "Ryouko's opponent is twice her size and has done this hundreds of times. It has never fought a teleporter. The duel lasts eleven seconds, and the watching Thinkers spend considerably longer than that replaying it.\n\n/Eukleia-chasing agrees that anyone who fights like that deserves a hearing."
 stella_tts_cons.6.a:0 "Clarisse is never going to let her forget this."
 stella_tts_cons.7.name:0 "A Ceremonial Defeat"
 stella_tts_cons.7.desc:0 "Ryouko loses, gracefully and at length. Her opponent is gracious about it, and /Eukleia-chasing notes her courage. It does not, however, offer its support."
 stella_tts_cons.7.a:0 "There are other Tentacles."
 stella_tts_cons.8.name:0 "The Consensus Deliberates"
 stella_tts_cons.8.desc.success:0 "The Tentacles meet, mind to mind, in a way no human could follow. Ryouko does her best anyway. /Somatic-diversity and /Eukleia-chasing speak for her, /Ahimsa-extending presents Homura's document, and /Thinker-preserving is asked to open its mind on the matter of the first contact.\n\nIt refuses. That is answer enough. The Consensus withdraws its mandate, and /Thinker-preserving will have to fight on without the rest of its civilization behind it.\n\nRyouko comes home changed. She still teleports into rooms mid-sentence."
 stella_tts_cons.8.desc.partial:0 "The Tentacles meet, mind to mind, and listen to Ryouko's case. Too few speak for her. The Consensus will not withdraw its mandate on one human's word, but it agrees to review the matter, and /Thinker-preserving is told to hold its next campaign while it does.\n\nRyouko comes home tired, with a head full of alien science and the conviction that next time she will win."
 stella_tts_cons.8.a:0 "The war against us is over. Theirs is just beginning."
 stella_tts_cons.8.a.tooltip:0 "The Cephalopods launch no more enforcement campaigns. /Thinker-preserving is §RCensured by the Consensus§!."
 stella_tts_cons.8.b:0 "It is a start."
 stella_tts_cons.8.b.tooltip:0 "The Cephalopods launch no new campaigns for 10 years."

 # --- The MSY and the Mitakihara Four ---
 tech_tts_msy_divisions:0 "MSY Divisions"
 tech_tts_msy_divisions_desc:0 "The mutual aid society grows an enforcement arm, an intelligence service and a guild of clairvoyants: the Soul Guard, the Black Heart and the Far Seers."
 tech_tts_taccomp_v2:0 "Version Two Tactical Computers"
 tech_tts_taccomp_v2_desc:0 "TacComps that learn, adapt and anticipate. They were never supposed to develop personalities. Some of them did anyway."
 tts_soul_guard_army:0 "Soul Guard"
 tts_soul_guard_army_plural:0 "Soul Guard"
 tts_soul_guard_army_desc:0 "The MSY's enforcement division. In ordinary times it hunts down the abhorrent and the insane. In war it is the elite core of the magical girl forces."
 edict_tts_black_heart:0 "Black Heart Operations"
 edict_tts_black_heart_desc:0 "Give the MSY's intelligence division, black-ops force and secret police a free hand. Crime falls. Nobody asks how."
 edict_tts_far_seers:0 "Consult the Far Seers"
 edict_tts_far_seers_desc:0 "Put our questions to the MSY guild of clairvoyants. Their more unusual members claim to see what is hidden by distance, by secrecy, and sometimes by time."
 building_tts_ribbon_chamber:0 "The Ribbon Chamber"
 building_tts_ribbon_chamber_desc:0 "A long hall of images: magical girls triumphant on one side, falling on the other. At the far end, in a glass box on a pedestal, rests a single ribbon. Pilgrims come hoping for a vision of the Goddess. Some of them get one.\n\nOnly one may be built. Visions of the Goddess come twice as often."
 leader_trait_tts_field_marshal:0 "Field Marshal"
 leader_trait_tts_field_marshal_desc:0 "Commands the war from the bridge of her flagship, cortical implants stretched across every ship in the fleet."
 leader_trait_tts_leadership_committee:0 "Leadership Committee"
 leader_trait_tts_leadership_committee_desc:0 "Sits on the committee that runs the MSY, and has for longer than most of its members have been alive."
 leader_trait_tts_black_heart_director:0 "Director of the Black Heart"
 leader_trait_tts_black_heart_director_desc:0 "Knows something about everyone, and keeps almost all of it to herself."
 NAME_tts_mami:0 "Tomoe Mami"
 NAME_tts_yuma:0 "Chitose Yuma"
 NAME_tts_kana:0 "Kuroi Kana"
 NAME_tts_kyouko:0 "Sakura Kyouko"
 stella_tts_four.2.name:0 "The Field Marshal"
 stella_tts_four.2.desc:0 "She was one of the Mitakihara Four, the handful of girls around whom the MSY first grew, and she has been fighting for longer than anyone else alive. Now Tomoe Mami accepts a Field Marshal's commission and takes her flag aboard the HSS Georgy Konstantinovich Zhukov.\n\nShe still names her attacks. Nobody has the heart to tell her to stop, and the recruits love it."
 stella_tts_four.2.a:0 "Tiro Finale."
 stella_tts_four.4.name:0 "The Head of the MSY"
 stella_tts_four.4.desc:0 "Chitose Yuma looks younger than most of the girls she commands, and is older than nearly all of them. She was the youngest of the Mitakihara Four. She has run the MSY's Leadership Committee through wars, schisms and the long peace, and she has agreed to sit on our council as well.\n\nShe asks for very little in return: an office, a direct line, and a promise that the government will consult the MSY before it spends its girls."
 stella_tts_four.4.a:0 "Welcome to the council, Director Chitose."
 stella_tts_four.6.name:0 "The Black Heart"
 stella_tts_four.6.desc:0 "The director of the MSY's intelligence division does not usually make appointments. Kuroi Kana simply appears in the meeting room, apologises for the intrusion, and lays out exactly what the Black Heart has learned this year, including several things our own intelligence services did not know they had missed.\n\nShe offers to sit on our council. It would be safer, she says, to have her where we can see her."
 stella_tts_four.6.a:0 "Better inside than outside."
 stella_tts_four.6.b:0 "We will take the report. The seat stays empty."
