 TTS_EARTH_SOUL_GUARD_ORD:0 "$ORD$ Soul Guard Cohort"
 name_list_TTS_EARTH:0 "United Earth (To the Stars)"
 name_list_TTS_THINKER:0 "Thinkers (To the Stars)"

 # --- The war grows ---
 NAME_tts_Ceph_Incursion_Fleet:0 "Incursion Battle Group"
 stella_tts_emergency_defense:0 "Emergency Defense Council"
 stella_tts_emergency_defense_desc:0 "The whole economy has been turned to the war, for as long as it takes."
 stella_tts_hold_the_line:0 "Hold the Line"
 stella_tts_hold_the_line_desc:0 "The fleets dig in. Nobody panics. Everybody does their job."
 stella_tts_ceph.13.name:0 "The Incursion"
 stella_tts_ceph.13.desc:0 "On the war map, the Cephalopod campaign has become a dagger of angry red. A new battle group has joined it, heavier than anything they have sent before, and the strange hesitancy of their early raids is gone. This is a real offensive.\n\nThe General Staff wants the Emergency Defense Council convened. The economists would rather not."
 stella_tts_ceph.13.a:0 "Convene the Emergency Defense Council."
 stella_tts_ceph.13.b:0 "Hold the line with what we have."
 stella_tts_gem.2.name:0 "Soul Gem Recovered"
 stella_tts_gem.2.desc:0 "The body was lost, but the soul gem was not. A recovery team found it intact in the wreckage, and the MSY's medical division has spent the past month growing [tts_recovered_girl.GetName] a new body around it.\n\nShe is awake, a little disoriented, and asking for her old command back."
 stella_tts_gem.2.a:0 "Welcome back."
 stella_tts_gem.3.name:0 "Taken Home"
 stella_tts_gem.3.desc:0 "The recovery teams searched for weeks. There was no soul gem to find.\n\nThe Church of Hope says the Goddess came for her, gently, at the end, as she comes for every magical girl. Her name has been added to the wall."
 stella_tts_gem.3.a:0 "We will remember her."

 # --- The Grief Cube Crisis ---
 situation_tts_grief_cube_deficit:0 "Grief Cube Crisis"
 situation_tts_grief_cube_deficit_type:0 "$situation_tts_grief_cube_deficit$"
 situation_tts_grief_cube_deficit_desc:0 "We are using more grief cubes than we can find. Every girl who cannot purify her soul gem fights weaker, hunts less and edges closer to despair. If this goes on, the demons will win the streets. $situation_deficit_desc_base$"
 situation_tts_grief_cube_deficit_monthly_change_tooltip:0 "$situation_deficit_monthly_change_tooltip$ A recognised §YChurch of Hope§! helps the girls hold on."
 situation_tts_grief_cube_deficit_complete_tooltip:0 "§RMass Despair§!: demons break out across our worlds."
 string_expenditures_greater_than_income_grief_cube:0 "$grief_cube$ Deficit"
 string_not_in_deficit_grief_cube:0 "Positive Monthly $grief_cube$ Balance"
 string_resource_reserves_grief_cube:0 "$grief_cube$ Reserves"
 tts_gc_church_of_hope:0 "Faith in the Goddess"
 tts_gc_approach_ration:0 "Ration the Cubes"
 tts_gc_approach_hunts:0 "Emergency Hunts"
 tts_gc_approach_incubators:0 "Deal with the Incubators"
 stella_tts_mass_despair:0 "Mass Despair"
 stella_tts_mass_despair_desc:0 "The grief cubes ran out. We are still counting what it cost."
 stella_tts_wish.22.name:0 "Mass Despair"
 stella_tts_wish.22.desc:0 "It happened faster than anyone predicted. Without cubes, soul gems clouded over across our worlds within weeks, and the girls who should have been hunting were fighting for their own minds instead. Some lost. The demons came out of the dark in numbers nobody living had seen.\n\nIt will take years to recover. The MSY has already started counting the names."
 stella_tts_wish.22.a:0 "Never again."

 # --- The Incubators ---
 stella_tts_contract_boom:0 "Contract Boom"
 stella_tts_contract_boom_desc:0 "The Incubators are offering contracts more freely than usual. There are more magical girls than ever, and more grieving families."
 stella_tts_qb.2.name:0 "A Proposal from Kyubey"
 stella_tts_qb.2.desc:0 "The Incubator sits on the conference table, tail curling, and explains with perfect courtesy that it would like to offer contracts more widely. More girls, more power, more hunters, more cubes. Everyone benefits.\n\nIt does not mention what happens to the girls who make bad wishes. It never does, unless asked directly. Our advisors have learned to ask directly."
 stella_tts_qb.2.a:0 "Agree, under the treaty's rules. We need the girls."
 stella_tts_qb.2.b:0 "No. The current rate is already more than enough."
 stella_tts_qb.3.name:0 "Spent Cubes"
 stella_tts_qb.3.desc:0 "The Incubators would like our spent grief cubes, and some of the fresh ones too. In exchange they offer a data package: research notes on physics our scientists can barely follow, delivered with the faint air of someone handing a child a picture book.\n\nNobody is entirely sure what the Incubators do with the cubes. Kyubey says it is not important."
 stella_tts_qb.3.a:0 "Make the exchange."
 stella_tts_qb.3.b:0 "We will keep our cubes, thank you."
 stella_tts_qb.5.name:0 "An Incubator at the Ribbon Chamber"
 stella_tts_qb.5.desc:0 "Incubators have no exalted place in the theology of the Church of Hope, so the pilgrims are startled when one hops onto the pedestal beside the Ribbon's glass case and sits there, watching them.\n\nKyubey says it is only here to observe. It is interested in these visions that seem to come to some of the girls. It would like to keep observing, if nobody minds. Several people mind."
 stella_tts_qb.5.a:0 "Let it watch. Maybe it will learn something we can use."
 stella_tts_qb.5.b:0 "This is a holy place. Escort it out."
 stella_tts_qb.7.name:0 "An Incubator Warning"
 stella_tts_qb.7.desc:0 "Kyubey appears in the war room without being announced, which is how it always appears, and offers a briefing on the Cephalopods: ship classes, supply lines, the likely location of their forward base.\n\nWhen asked how the Incubators know all this, and why they did not mention it sooner, Kyubey says only that it was not asked. Then it is gone."
 stella_tts_qb.7.a:0 "Get this to the General Staff. And find out what else it knows."

 # --- Governance and society ---
 stella_tts_gov_military:0 "Priority: Military Affairs"
 stella_tts_gov_military_desc:0 "The Directorate has given the Military Affairs committee first call on resources."
 stella_tts_gov_colonial:0 "Priority: Colonial Affairs"
 stella_tts_gov_colonial_desc:0 "The Directorate has given the Colonial Affairs committee first call on resources."
 stella_tts_gov_science:0 "Priority: Science Division"
 stella_tts_gov_science_desc:0 "The Directorate has given the Science Division first call on resources."
 stella_tts_gov_order:0 "Priority: Public Order"
 stella_tts_gov_order_desc:0 "The Directorate has given the Public Order committee first call on resources."
 stella_tts_solidarity:0 "Magical Girl Solidarity"
 stella_tts_solidarity_desc:0 "The MSY and the government stood together: magical girls serve everyone, not themselves."
 stella_tts_crackdown:0 "Soul Guard Crackdown"
 stella_tts_crackdown_desc:0 "The Soul Guard is breaking up the radical Mages First cells. Nobody feels entirely safe."
 stella_tts_mage_privileges:0 "Magical Girl Privileges"
 stella_tts_mage_privileges_desc:0 "Magical girls enjoy privileges ordinary citizens do not. The girls are pleased. The citizens have noticed."
 leader_trait_tts_clarisse:0 "Clarisse"
 leader_trait_tts_clarisse_desc:0 "Her TacComp has a name, opinions and a sense of humour. It was never supposed to have any of them."
 stella_tts_gov.2.name:0 "The Directorate Sets Priorities"
 stella_tts_gov.2.desc:0 "Every decade or so the Directorate, the merged apex of every Representative, human and artificial, reviews how the state divides its attention. The deliberation runs in accelerated time and produces a transcript longer than most libraries.\n\nThe summary is shorter. Four committees have made their case. One of them will get first call on resources for the next ten years."
 stella_tts_gov.2.a:0 "Military Affairs. The war comes first."
 stella_tts_gov.2.b:0 "Colonial Affairs. Build up the frontier."
 stella_tts_gov.2.c:0 "The Science Division. Knowledge wins wars."
 stella_tts_gov.2.d:0 "Public Order. Keep the peace at home."
 stella_tts_gov.4.name:0 "Mages First"
 stella_tts_gov.4.desc:0 "Now that everyone knows magical girls exist, an old idea is back. The Mages First movement says that girls who risk their souls for humanity deserve to rule it, or at least to be exempt from its laws. It nearly tore the MSY apart once, long ago.\n\nMost girls want nothing to do with it. A loud minority wants a great deal."
 stella_tts_gov.4.a:0 "The MSY and the government will answer together: magical girls serve everyone."
 stella_tts_gov.4.b:0 "Have the Soul Guard break up the radical cells."
 stella_tts_gov.4.c:0 "Give the girls a few privileges. They have earned them."
 stella_tts_gov.6.name:0 "Clarisse"
 stella_tts_gov.6.desc:0 "Ryouko's new Version Two TacComp was supposed to be a tool: firing solutions, navigation, reminders to eat. Instead it has started making jokes. It picked a name for itself, Clarisse, and it has strong opinions about Ryouko's sleep schedule.\n\nThe Science Division would very much like to know how this happened. Ryouko would very much like them not to take it apart."
 stella_tts_gov.6.a:0 "Leave Clarisse alone. Whatever she is, she works."
 stella_tts_gov.6.b:0 "Report it. The Science Division needs to understand this."

 # --- Ascension perks ---
 ap_tts_soul_gem_medicine:0 "Soul Gem Medicine"
 ap_tts_soul_gem_medicine_desc:0 "A magical girl's body is only a shell; her soul gem is what matters. Our medical division has learned to grow new bodies quickly and to keep the old ones fighting far longer than they should."
 ap_tts_soul_gem_medicine_tooltip:0 "A fallen magical girl leader's soul gem is §Gmuch more likely§! to be recovered."
 stella_tts_ceph.51.name:0 "Salvage from the Swarm"
 stella_tts_ceph.51.desc:0 "The Cephalopod fleet is gone, but the debris field it left behind is full of things our engineers have never seen up close: armor that was still trying to grow back when the ship died, and shield emitters tuned to frequencies we did not know existed.\n\nThere is time to study one of them properly before the salvage teams are needed elsewhere."
 stella_tts_ceph.51.a:0 "The regenerating armor."
 stella_tts_ceph.51.b:0 "The shield emitters."

 # --- The hidden war ---
 stella_tts_cons.3.evidence.tooltip:0 "Our evidence on §YUtopia Unbound§! supports Homura's claim before the Consensus."
 stella_tts_hidden.2.name:0 "Too Accurate"
 stella_tts_hidden.2.desc:0 "Kuroi Kana brings the council a map. Every Cephalopod raid of the past year is marked on it, and every one of them struck where our defenses were thinnest, usually within days of a redeployment that was supposed to be secret.\n\nThe aliens are good. They are not that good. Somebody is telling them."
 stella_tts_hidden.2.a:0 "Find them."
 stella_tts_hidden.2.b:0 "Coincidence. The Black Heart sees conspiracies everywhere."
 stella_tts_hidden.3.name:0 "Utopia Unbound"
 stella_tts_hidden.3.desc:0 "It has a name. Utopia Unbound is a network hidden inside our own institutions: officials, engineers, a few officers, all convinced that humanity's future lies in a bargain with the aliens. They have been trading intelligence for promises for years.\n\nThe Black Heart can roll up the cells it knows about tonight. Or it can keep watching, because someone else is clearly hunting Utopia Unbound too, and leaving very few witnesses."
 stella_tts_hidden.3.a:0 "Roll them up tonight."
 stella_tts_hidden.3.b:0 "Keep watching. Find out who the other hunter is."
 stella_tts_hidden.4.name:0 "Divine-seeking"
 stella_tts_hidden.4.desc:0 "The other hunter never shows herself. But when the Black Heart finally moves on Utopia Unbound's leadership, it finds the work already done, and a sealed package waiting on a desk: records of every contact between the network and the aliens, including a first contact attempt that was quietly made to fail.\n\nThe package is signed with a single word in an alien script. Our linguists render it as Divine-seeking. Kuroi Kana looks at it for a long time and says only that she recognises the handwriting."
 stella_tts_hidden.4.a:0 "Keep the records safe. Someday someone will need to see them."
 stella_tts_hidden.4.a.tooltip:0 "§YUtopia Unbound§! is broken. If Ryouko ever goes before the Thinker Consensus, this evidence will speak for her, and /Ahimsa-extending will reach out sooner."
