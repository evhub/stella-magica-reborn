stella_goddess_smile:0 "A Goddess' Smile"
stella_goddess_smile_desc:0 "Everyone's day seems to be ever so slightly brighter."
stella_goddess_insight:0 "A Goddess' Insight"
stella_goddess_insight_desc:0 "Technological breakthroughs come ever so slightly easier."
stella_goddess_teachings:0 "A Goddess' Teachings"
stella_goddess_teachings_desc:0 "New knowledge is learned ever so slightly quicker."
stella_goddess_encourage:0 "A Goddess' Encouragement"
stella_goddess_encourage_desc:0 "Difficult work seems to be ever so slightly easier."

stella_goddess_might:0 "A Goddess' Might"
stella_goddess_might_desc:0 "Weapons seem to strike ever so slightly harder."
stella_goddess_guidance:0 "A Goddess' Guidance"
stella_goddess_guidance_desc:0 "Projectiles seem to fly ever so slightly truer."
stella_goddess_protection:0 "A Goddess' Protection"
stella_goddess_guidance_protection:0 "Incoming fire seems to impact ever so slightly softer."

mod_country_grief_cube_produces_mult:0 "Monthly Grief Cubes"
