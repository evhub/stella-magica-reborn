leader_trait_goddess_hope:0 "§PGoddess of Salvation§!"
leader_trait_goddess_hope_desc:0 "\"Everyone, believe in the power that fulfills hopes and dreams!\""
leader_trait_goddess_redux:0 "§PGoddess of Salvation§!"
leader_trait_goddess_redux_desc:0 "\"If someone ever tells me it's a mistake to have hope, I'll just tell them they're wrong\""


